<style>
  :root{
    --bg:      oklch(98% 0.004 95);
    --surface: oklch(100% 0.002 95);
    --fg:      oklch(20% 0.018 70);
    --muted:   oklch(48% 0.012 70);
    --border:  oklch(90% 0.006 95);
    --accent:  oklch(52% 0.10 28);
    --font-display: 'Iowan Old Style','Charter',Georgia,serif;
    --font-body:    -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:    ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
    --measure: 1280px;
    --pad: clamp(20px, 5vw, 64px);
    --header-h: 72px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:var(--surface)}
  img{display:block; max-width:100%}
  a{color:inherit; text-decoration:none}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  /* ---------- Shared ---------- */
  .shell{max-width:var(--measure); margin-inline:auto; padding-inline:var(--pad)}
  .kicker{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .kicker::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .js .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s var(--ease), transform .7s var(--ease)}
  .js .reveal.in{opacity:1; transform:none}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40;
    height:var(--header-h);
    background:color-mix(in oklch, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .site-header .shell{height:100%; display:flex; align-items:center; justify-content:space-between; gap:24px}
  .brand{font-family:var(--font-display); font-size:19px; letter-spacing:-.01em}
  .brand em{font-style:italic}
  .nav{display:flex; align-items:center; gap:clamp(16px,2.4vw,32px)}
  .nav-link{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    position:relative; padding:6px 2px;
  }
  .nav-link::after{
    content:""; position:absolute; left:2px; right:2px; bottom:0; height:1px;
    background:var(--accent); transform:scaleX(0); transform-origin:left;
    transition:transform .35s var(--ease);
  }
  .nav-link:hover{color:var(--accent)}
  .nav-link:hover::after,.nav-link:focus-visible::after{transform:scaleX(1)}
  .nav-link[aria-current="page"]{color:var(--accent)}
  .nav-link[aria-current="page"]::after{transform:scaleX(1)}
  .lang-toggle{display:inline-flex; align-items:center; gap:8px; background:none; border:0; padding:6px 2px; cursor:pointer; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; white-space:nowrap}
  .lang-toggle__cur{color:var(--fg); font-weight:600}
  .lang-toggle:hover{color:var(--accent)}
  .lang-toggle:hover .lang-toggle__cur{color:var(--accent)}
  .lang-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .menu .lang-toggle{margin-top:clamp(20px,4vh,40px)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .nav-toggle{display:none; background:none; border:1px solid var(--fg); color:var(--fg); font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:10px 16px; cursor:pointer; min-height:44px}
  .nav-toggle:hover{background:var(--fg); color:var(--bg)}

  .menu{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; justify-content:center;
    padding:var(--pad);
    transform:translateY(-102%); visibility:hidden;
    transition:transform .5s var(--ease), visibility .5s;
  }
  .menu.open{transform:none; visibility:visible}
  .menu-close{position:absolute; top:18px; right:var(--pad); background:none; border:1px solid var(--fg); color:var(--fg); font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:10px 16px; cursor:pointer; min-height:44px}
  .menu-close:hover{background:var(--fg); color:var(--bg)}
  .menu-link{font-family:var(--font-display); font-size:clamp(36px,9vw,56px); line-height:1.2; padding:6px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline}
  .menu-link small{font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; color:var(--muted)}
  .menu-link:hover{color:var(--accent)}
  .menu-foot{margin-top:clamp(32px,6vh,64px); font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; color:var(--muted)}
  .menu-foot a{border-bottom:1px solid var(--border); padding-bottom:1px; transition:color .3s, border-color .3s}
  .menu-foot a:hover{color:var(--accent); border-color:var(--accent)}

  /* ---------- Diary index ---------- */
  .dy-view{border-top:none; padding-top:clamp(48px,6vh,72px); padding-bottom:clamp(80px,10vw,120px)}
  .dy-head{margin-bottom:clamp(36px,5vw,64px)}
  .dy-title{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(52px,8.6vw,110px);
    line-height:.98;
    letter-spacing:-.02em;
    margin:18px 0 0;
    text-wrap:balance;
  }
  .dy-sub{
    display:flex; justify-content:space-between; align-items:baseline; gap:24px;
    margin-top:clamp(20px,2.6vw,30px);
    padding-top:clamp(16px,2vw,22px);
    border-top:1px solid var(--border);
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted);
  }
  .dy-sub p{margin:0}
  .dy-sub .dy-count{white-space:nowrap}

  /* ---------- Grid (3:2 — the book pages are landscape) ---------- */
  .works-grid{
    list-style:none; margin:0; padding:0;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:clamp(14px,1.8vw,24px);
  }
  .work-card{display:block}
  .work-figure{
    margin:0; position:relative; overflow:hidden;
    aspect-ratio:3/2; background:var(--surface);
    border:1px solid var(--border);
    transition:border-color .4s var(--ease);
  }
  .work-figure img{width:100%; height:100%; object-fit:cover; transition:transform .7s var(--ease)}
  .work-card:hover .work-figure{border-color:color-mix(in oklch, var(--fg) 30%, var(--border))}
  .work-card:hover .work-figure img{transform:scale(1.035)}

  .work-reveal{
    position:absolute; inset:auto 0 0 0;
    background:color-mix(in oklch, var(--surface) 82%, transparent);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    border-top:1px solid var(--border);
    padding:8px 12px 10px;
    transform:translateY(102%);
    transition:transform .45s var(--ease);
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    font-family:var(--font-mono);
  }
  .work-card:hover .work-reveal,.work-card:focus-visible .work-reveal{transform:none}
  .work-reveal__index{font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}

  .work-caption{display:none}
  @media (hover:none){
    .work-reveal{display:none}
    .work-caption{
      display:flex; justify-content:space-between; align-items:baseline; gap:16px;
      margin-top:8px;
    }
    .work-caption .wc-meta{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; white-space:nowrap}
  }

  /* ---------- Floating eye (draggable -> All Works) ---------- */
  .orb{
    position:fixed;
    bottom:clamp(20px,4vh,44px);
    right:clamp(10px,1.2vw,22px);
    width:clamp(54px,6.8vw,84px);
    display:flex; align-items:center; justify-content:center;
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    animation:bob 7s ease-in-out infinite;
    filter:drop-shadow(0 14px 24px rgba(27,21,13,.18));
  }
  .orb.dragging{animation:none; cursor:grabbing; z-index:60}
  .orb.dragging svg{transform:scale(.96); transition:none}
  .orb svg{display:block; width:100%; height:auto; transition:transform .35s var(--ease)}
  .orb .eye-blink{transform-box:fill-box; transform-origin:center; animation:blink 8s ease-in-out infinite}
  @keyframes blink{0%,90%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%,100%{transform:scaleY(1)}}
  .orb:hover svg{transform:scale(1.07)}
  .orb:focus-visible{outline:2px solid var(--accent); outline-offset:6px; border-radius:50%}
  .orb.dragging .eye-blink{animation:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

  /* ---------- Lightbox (diary viewer) ---------- */
  .fs{
    position:fixed; inset:0; z-index:90;
    background:var(--surface);
    display:none;
    align-items:center; justify-content:center;
    padding:clamp(16px,3vw,40px);
  }
  .fs.open{display:flex}
  .fs-img{
    max-width:100%; max-height:92vh; width:auto; height:auto;
    object-fit:contain;
    box-shadow:0 12px 40px rgba(27,21,13,.18);
  }
  .fs-close{
    position:absolute; top:clamp(12px,2.5vw,24px); right:clamp(12px,2.5vw,24px);
    background:none; border:0; color:var(--fg); cursor:pointer;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  }
  .fs-close svg{width:22px; height:22px; display:block}
  .fs-close:hover{color:var(--accent)}
  .fs-close:active{transform:scale(.92)}
  .fs-close:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:0}
  .fs-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    background:none; border:0; cursor:pointer; color:var(--muted);
    width:56px; height:64px; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .fs-nav svg{width:clamp(22px,2.6vw,30px); height:auto; display:block}
  .fs-nav:hover{color:var(--accent)}
  .fs-nav:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .fs-prev{left:clamp(8px,2vw,28px)}
  .fs-next{right:clamp(8px,2vw,28px)}
  .fs-count{
    position:absolute; bottom:clamp(12px,2.5vw,24px); left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); white-space:nowrap;
  }

  /* ---------- Footer ---------- */
  .site-footer{border-top:1px solid var(--border); padding-block:30px}
  .site-footer .shell{display:flex; align-items:center; justify-content:space-between; gap:20px; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .to-top{padding:6px 2px; color:var(--muted); transition:color .3s}
  .to-top:hover{color:var(--accent)}
  .to-top-eye{display:none; width:17px; height:auto}
  .to-top-eye svg{display:block; width:100%; height:auto}

  /* ---------- Responsive ---------- */
  @media (max-width:1120px){
    .orb{right:clamp(10px,1.2vw,22px)}
    .works-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:900px){
    .orb{width:clamp(48px,12vw,60px)}
    .to-top-eye{display:inline-block; margin-right:9px; vertical-align:-3px}
    .to-top-arrow{display:none}
    .works-grid{grid-template-columns:repeat(3,1fr)}
    .work-reveal{display:none}
    .work-caption{display:none}
  }
  @media (max-width:760px){
    .nav{display:none}
    .site-header .lang-toggle{display:none}
    .nav-toggle{display:inline-block}
    .site-footer .shell{flex-wrap:wrap; row-gap:10px; justify-content:center}
    .works-grid{grid-template-columns:repeat(3,1fr); gap:10px}
    .work-caption{display:none}
    .dy-sub{flex-direction:column; align-items:flex-start; gap:6px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
    html{scroll-behavior:auto}
    .js .reveal{opacity:1; transform:none}
  }
</style>

<script>
  window.AK_I18N = {
    de: {
      'dy.kicker': '03 — Tagebuch',
      'dy.title': 'Tagebuch',
      'dy.intro': 'Seiten aus dem Skizzenbuch — aus dem Buch fotografiert.',
      'dy.count': '210 Seiten',
      'dy.fs.aria': 'Tagebuch — Vollbild',
      'dy.fs.close.aria': 'Lichtbild schließen'
    }
  };
</script>
<script>

  // ----- floating eye: drag + click -> all works -----
  (function(){
    const orb = document.getElementById('orb');
    const KEY = 'ak-orb-pos';
    const goAllWorks = () => { window.location.href = 'all-works.html'; };
    let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
    const clamp = (v, mn, mx) => Math.max(mn, Math.min(v, mx));
    function apply(x, y){
      const r = orb.getBoundingClientRect();
      x = clamp(x, 8, window.innerWidth - r.width - 8);
      y = clamp(y, 8, window.innerHeight - r.height - 8);
      orb.style.left = x + 'px';
      orb.style.top = y + 'px';
      orb.style.right = 'auto';
      orb.style.bottom = 'auto';
    }
    orb.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      const r = orb.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      dragging = true; moved = false;
      orb.classList.add('dragging');
      try { orb.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });
    orb.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      apply(ox + dx, oy + dy);
    });
    function end(e){
      if (!dragging) return;
      dragging = false;
      orb.classList.remove('dragging');
      try { orb.releasePointerCapture(e.pointerId); } catch (_) {}
      if (moved) {
        try { localStorage.setItem(KEY, JSON.stringify({
          x: parseFloat(orb.style.left) || 0, y: parseFloat(orb.style.top) || 0
        })); } catch (_) {}
        e.preventDefault();
        e.stopPropagation();
        orb.dataset.justDragged = '1';
      }
    }
    orb.addEventListener('pointerup', end);
    orb.addEventListener('pointercancel', end);
    orb.addEventListener('click', (e) => {
      if (orb.dataset.justDragged === '1') { delete orb.dataset.justDragged; e.preventDefault(); e.stopPropagation(); return; }
      goAllWorks();
    });
    try {
      const p = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (p && typeof p.x === 'number' && typeof p.y === 'number') apply(p.x, p.y);
    } catch (_) {}
    window.addEventListener('resize', () => {
      if (!orb.style.left) return;
      try {
        const p = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (p) apply(p.x, p.y);
      } catch (_) {}
    });
  })();
  const orb = document.getElementById('orb');
  orb.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.location.href = 'all-works.html'; }
  });

  document.querySelectorAll('a[href="#top"]').forEach((a) => {
    a.addEventListener('click', (e) => { e.preventDefault(); window.scrollTo({ top: 0 }); });
  });

  const menu = document.getElementById('menu');
  const openBtn = document.querySelector('.nav-toggle');
  const closeBtn = document.querySelector('.menu-close');
  function setMenu(open) {
    menu.classList.toggle('open', open);
    menu.setAttribute('aria-hidden', String(!open));
    openBtn.setAttribute('aria-expanded', String(open));
    document.body.style.overflow = open ? 'hidden' : '';
  }
  openBtn.addEventListener('click', () => setMenu(true));
  closeBtn.addEventListener('click', () => setMenu(false));
  menu.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setMenu(false)));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

  // ----- Diary lightbox viewer -----
  const TOTAL = 210;
  const cards = Array.from(document.querySelectorAll('.work-card[data-n]'));
  const fs = document.getElementById('fs');
  const fsImg = document.getElementById('fs-img');
  const fsCount = document.getElementById('fs-count');
  const fsPrev = document.getElementById('fs-prev');
  const fsNext = document.getElementById('fs-next');
  const fsClose = document.getElementById('fs-close');
  let cur = 1, fsOpen = false;

  const pad3 = (n) => String(n).padStart(3, '0');
  const fileOf = (n) => 'assets/diary/diary-' + pad3(n) + '.jpg';
  const isMobile = () => window.matchMedia('(max-width: 900px)').matches;

  function syncFs(){
    fsImg.src = fileOf(cur);
    fsImg.alt = 'Diary page ' + pad3(cur);
    fsCount.textContent = pad3(cur) + ' / ' + pad3(TOTAL);
  }
  function openFs(n){
    cur = n; fsOpen = true;
    fs.classList.add('open');
    document.body.style.overflow = 'hidden';
    syncFs();
  }
  function closeFs(){
    if (!fsOpen) return;
    fsOpen = false;
    fs.classList.remove('open');
    document.body.style.overflow = '';
  }
  function go(d){
    let n = cur + d;
    if (n < 1) n = TOTAL;
    if (n > TOTAL) n = 1;
    cur = n;
    syncFs();
  }

  cards.forEach((card) => {
    card.addEventListener('click', (e) => { e.preventDefault(); openFs(parseInt(card.dataset.n, 10)); });
  });

  // keyboard
  document.addEventListener('keydown', (e) => {
    if (!fsOpen) return;
    if (e.key === 'Escape') closeFs();
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });

  // touch swipe (mobile) — horizontal only, don't fight vertical scroll
  let tX = null, tY = null;
  fs.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    tX = t.clientX; tY = t.clientY;
  }, { passive: true });
  fs.addEventListener('touchend', (e) => {
    if (tX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tX;
    const dy = t.clientY - tY;
    tX = null; tY = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) go(1); else go(-1);
      fs.dataset.swiped = '1';
      setTimeout(() => { delete fs.dataset.swiped; }, 350);
    }
  }, { passive: true });

  fsClose.addEventListener('click', (e) => { e.stopPropagation(); closeFs(); });
  fsPrev.addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
  fsNext.addEventListener('click', (e) => { e.stopPropagation(); go(1); });
  fs.addEventListener('click', () => {
    if (fs.dataset.swiped === '1') return;
    closeFs();
  });

</script>
